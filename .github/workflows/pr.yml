    name: PR

    on:
        pull_request:
          branches:
            - main
          paths:
            - "frontend/restaurant-frontend-app/**"
            - ".github/workflows/pr.yml"

        push:
          branches: 
            - main
          paths:
            - 'frontend/restaurant-frontend-app/**'
            - '.github/workflows/pr.yml'
        workflow_dispatch:

    concurrency:
        group: pr-${{ github.ref }}
        cancel-in-progress: true
      
    permissions:
      contents: read

    jobs:
        frontend:
            runs-on: ubuntu-latest
            timeout-minutes: 15
            env:
                BACKEND_URL: ${{ vars.BACKEND_URL || 'https://ci.invalid' }}
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_REGION: eu-north-1
            defaults:
                run:
                    working-directory: frontend/restaurant-frontend-app
            steps: 
                - uses: actions/checkout@v5

                - uses: actions/setup-node@v5
                  with:
                    node-version-file: frontend/restaurant-frontend-app/.nvmrc
                    cache: npm
                    cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
                
                - name: Install
                  run: npm ci

                # TODO(#57): enable after the Prettier sweep - 66 files unformatted (as of 28 august 2026)
                # - name: Format check
                #   run: npx prettier --check "src/**/*.{ts,html,scss}"

                - name: Lint
                  run: npm run lint

                - name: Type-check app
                  run: npx tsc -p tsconfig.app.json --noEmit

                - name: Type-check specs
                  run: npx tsc -p tsconfig.spec.json --noEmit

                # TODO(#90): enable once unit tests are stable in CI ()
                # - name: Unit tests
                #  run: npm test -- --watch=false --browsers=ChromeHeadless
                #  env:
                #    CHROME_BIN: /usr/bin/google-chrome

                - name: Production build
                  run: npm run build

                - name: Check frontend deployment configuration
                  if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' || vars.S3_BUCKET == '')
                  run: echo "::warning::Frontend deployment skipped because AWS access key secrets or S3_BUCKET is not configured."
                
                - name: Configure AWS Credentials
                  if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && vars.S3_BUCKET != ''
                  uses: aws-actions/configure-aws-credentials@v4
                  with:
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: eu-north-1

                - name: Deploy to S3
                  if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && vars.S3_BUCKET != ''
                  run: aws s3 sync dist/restaurant-frontend-app/browser s3://${{ vars.S3_BUCKET }}/ --delete