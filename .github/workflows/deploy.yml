name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Run syndicate deploy instead of update"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_DIR: backend/restaurant-backend-app
  AWS_REGION: eu-north-1
  DEPLOY_NAME: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS configuration
        if: env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == ''
        run: echo "::warning::Backend deployment skipped because AWS access key secrets are not configured."

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify identity
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: aws sts get-caller-identity

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-syndicate-${{ runner.os }}

      - name: Install AWS Syndicate
        run: pip install aws-syndicate

      - name: Syndicate build
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate build

      - name: Syndicate deploy
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.deploy }}
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate deploy --deploy_name ${{ env.DEPLOY_NAME }}

      - name: Syndicate update
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy)) }}
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate update
