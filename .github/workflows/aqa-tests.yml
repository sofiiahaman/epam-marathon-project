name: AQA Tests

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "aqa/restaurant-aqa-framework/**"
      - ".github/workflows/aqa-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "aqa/restaurant-aqa-framework/**"
      - ".github/workflows/aqa-tests.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which scenarios to run"
        type: choice
        options:
          - all
          - ui
          - api
        default: all
      custom_filter:
        description: >
          Optional Microsoft.Testing.Platform tree filter (overrides "scope" when set), e.g.
          /*/*/*/*[Category=smoke] to run only @smoke-tagged scenarios. See
          https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-filters
        type: string
        default: ""
      seed_demo_data:
        description: "Create persistent demo location, dishes and tables for manual verification"
        type: boolean
        default: false

  # The scenarios run against the deployed environment and take minutes, so they run on demand and nightly.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: aqa-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aqa/restaurant-aqa-framework
    env:
      HEADLESS: "true"
      # Default anyway (Configuration/Settings.cs) - set explicitly so the choice is visible here:
      # a trace is only captured for a failed @ui scenario (or one tagged @trace-always).
      TRACE_MODE: "OnFailureOnly"
    steps:
      - uses: actions/checkout@v5

      # Configuration reaches the tests as real environment variables. A repository variable/secret
      # (Settings -> Secrets and variables -> Actions) wins when it is set; anything not provided
      # falls back to a local `.env` if one exists (it is never committed, so in CI it normally does not),
      # and an unset value stays unset. Credentials are masked in the log.
      - name: Configure environment
        shell: bash
        env:
          AQA_UI_URL: ${{ vars.AQA_UI_URL }}
          AQA_API_URL: ${{ vars.AQA_API_URL }}
          AQA_TESTTABLE_ID: ${{ vars.AQA_TESTTABLE_ID }}
          AQA_WAITER_USERNAME: ${{ secrets.AQA_WAITER_USERNAME }}
          AQA_WAITER_PASSWORD: ${{ secrets.AQA_WAITER_PASSWORD }}
          AQA_ADMIN_USERNAME: ${{ secrets.AQA_ADMIN_USERNAME }}
          AQA_ADMIN_PASSWORD: ${{ secrets.AQA_ADMIN_PASSWORD }}
          AQA_TESTTABLE_WAITER_USERNAME: ${{ secrets.AQA_TESTTABLE_WAITER_USERNAME }}
          AQA_TESTTABLE_WAITER_PASSWORD: ${{ secrets.AQA_TESTTABLE_WAITER_PASSWORD }}
        run: |
          declare -A dotenv
          if [ -f .env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ -z "$line" || "$line" == \#* || "$line" != *=* ]]; then continue; fi
              key="${line%%=*}"; value="${line#*=}"
              value="${value%\"}"; value="${value#\"}"
              dotenv["$key"]="$value"
            done < <(tr -d '\r' < .env)
          fi

          pairs="
          UI_URL:AQA_UI_URL
          API_URL:AQA_API_URL
          TESTTABLE_ID:AQA_TESTTABLE_ID
          WAITER_USERNAME:AQA_WAITER_USERNAME
          WAITER_PASSWORD:AQA_WAITER_PASSWORD
          ADMIN_USERNAME:AQA_ADMIN_USERNAME
          ADMIN_PASSWORD:AQA_ADMIN_PASSWORD
          TESTTABLE_WAITER_USERNAME:AQA_TESTTABLE_WAITER_USERNAME
          TESTTABLE_WAITER_PASSWORD:AQA_TESTTABLE_WAITER_PASSWORD
          "
          for pair in $pairs; do
            name="${pair%%:*}"; provided="${pair##*:}"
            value="${!provided:-}"
            if [ -z "$value" ]; then value="${dotenv[$name]:-}"; fi
            if [ "$name" = "API_URL" ] && [ -z "$value" ]; then
              value="https://uwqq8dm70d.execute-api.eu-north-1.amazonaws.com/develop"
              echo "API_URL: using the shared develop deployment"
            fi
            if [ -z "$value" ]; then echo "$name: not set"; continue; fi
            case "$name" in *USERNAME|*PASSWORD) echo "::add-mask::$value" ;; esac
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name: set"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Resolve test filter
        id: filter
        shell: bash
        run: |
          custom_filter="${{ inputs.custom_filter }}"
          scope="${{ inputs.scope || 'all' }}"
          ui_url="${UI_URL:-}"

          if [ -n "$custom_filter" ]; then
            filter="$custom_filter"
          elif [ "$scope" = "ui" ]; then
            filter="/*/*/*/*[Category=ui]"
          elif [ "$scope" = "api" ]; then
            filter="/*/*/*/*[Category=api]"
          elif [ -z "$ui_url" ]; then
            echo "UI_URL is not configured; running API scenarios only."
            filter="/*/*/*/*[Category=api]"
          else
            filter=""
          fi

          echo "filter=$filter" >> "$GITHUB_OUTPUT"

      - name: Seed persistent demo data
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          SEED_USERNAME: ${{ secrets.AQA_WAITER_USERNAME }}
          SEED_PASSWORD: ${{ secrets.AQA_WAITER_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${API_URL:-}" || -z "${SEED_USERNAME:-}" || -z "${SEED_PASSWORD:-}" ]]; then
            echo "::error::API_URL, AQA_WAITER_USERNAME and AQA_WAITER_PASSWORD are required for demo seeding."
            exit 1
          fi

          json_response() {
            local method="$1"
            local url="$2"
            local body="${3:-}"
            if [[ -n "$body" ]]; then
              curl --fail-with-body --silent --show-error --request "$method" \
                --header "Authorization: Bearer $TOKEN" \
                --header "Content-Type: application/json" \
                --data "$body" "$url"
            else
              curl --fail-with-body --silent --show-error --request "$method" \
                --header "Authorization: Bearer $TOKEN" \
                --header "Content-Type: application/json" "$url"
            fi
          }

          signin_payload="$(jq -cn --arg email "$SEED_USERNAME" --arg password "$SEED_PASSWORD" \
            '{email: $email, password: $password}')"
          signin="$(curl --fail-with-body --silent --show-error --request POST \
            --header "Content-Type: application/json" \
            --data "$signin_payload" "$API_URL/signin")"
          TOKEN="$(jq -er '.idToken' <<< "$signin")"

          existing="$(json_response GET "$API_URL/locations")"
          location_id="$(jq -r '.[] | select(.address == "Manual-AQA-Demo") | .id' <<< "$existing" | head -n 1)"

          if [[ -z "$location_id" || "$location_id" == "null" ]]; then
            location_payload='{"address":"Manual-AQA-Demo","description":"Persistent data for manual verification","totalCapacity":40,"averageOccupancy":"0"}'
            location="$(json_response POST "$API_URL/locations" "$location_payload")"
            location_id="$(jq -er '.id' <<< "$location")"
            echo "Created demo location $location_id."
          else
            echo "Demo location already exists: $location_id."
          fi

          tables="$(curl --silent --show-error --request GET \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            "$API_URL/locations/$location_id/tables/all" || echo '[]')"
          tables="$(jq -c 'if type == "array" then . else [] end' <<< "$tables")"
          table_id="$(jq -r '[.[] | select(.capacity >= 3) | .id][0] // empty' <<< "$tables")"

          if [[ -z "$table_id" ]]; then
            table_suffix="$((1000 + RANDOM % 8000))"
            for table in 2 4 8; do
              table_payload="$(jq -cn --arg location_id "$location_id" --argjson capacity "$table" \
                --argjson table_number "$((table_suffix + table))" \
                '{locationId: $location_id, capacity: $capacity, tableNumber: $table_number}')"
              created_table="$(json_response POST "$API_URL/tables" "$table_payload")"
              if [[ "$table" == "4" ]]; then
                table_id="$(jq -er '.id' <<< "$created_table")"
              fi
            done
            echo "Created demo tables."
          else
            echo "Demo table already exists: $table_id."
          fi

          for dish in \
            '{"name":"Manual-AQA-Pasta","description":"Demo pasta","dishType":"MainCourse","price":18.50,"weight":"350g","calories":"650","proteins":"20","fats":"18","carbohydrates":"75","vitamins":"A, C","locationIds":[],"state":"Available"}' \
            '{"name":"Manual-AQA-Salad","description":"Demo salad","dishType":"Appetizer","price":9.50,"weight":"220g","calories":"240","proteins":"8","fats":"10","carbohydrates":"25","vitamins":"A, C","locationIds":[],"state":"Available"}' \
            '{"name":"Manual-AQA-Cake","description":"Demo dessert","dishType":"Dessert","price":7.50,"weight":"160g","calories":"420","proteins":"6","fats":"19","carbohydrates":"55","vitamins":"B, C","locationIds":[],"state":"Available"}'
          do
            dish_name="$(jq -r '.name' <<< "$dish")"
            existing_dish="$(json_response GET "$API_URL/dishes" | jq -r --arg name "$dish_name" '.[] | select(.name == $name) | .id' | head -n 1)"
            if [[ -z "$existing_dish" || "$existing_dish" == "null" ]]; then
              dish_payload="$(jq -c --arg location_id "$location_id" '.locationIds = [$location_id]' <<< "$dish")"
              json_response POST "$API_URL/dishes" "$dish_payload" >/dev/null
            fi
          done

          echo "TESTTABLE_ID=$table_id" >> "$GITHUB_ENV"
          echo "TESTTABLE_ID configured for this run."

          echo "Created persistent demo data."
          echo "Location ID: $location_id"
          echo "Manual frontend: https://d2yin0g5tqvkt6.cloudfront.net/main"

      # A failed test must never stop the pipeline: artifact/report/summary steps below all run
      # with `if: always()` so they still publish when this step reports a failure.
      - name: Run tests
        id: run_tests
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ steps.filter.outputs.filter }}" ]; then
            dotnet bin/Release/net10.0/restaurant-aqa-framework.dll --report-trx \
              --results-directory TestResults --treenode-filter "${{ steps.filter.outputs.filter }}"
          else
            dotnet bin/Release/net10.0/restaurant-aqa-framework.dll --report-trx \
              --results-directory TestResults
          fi

      - name: Upload TUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-report
          path: |
            aqa/restaurant-aqa-framework/TestResults/*-report.html
            aqa/restaurant-aqa-framework/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Reqnroll report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqnroll-report
          path: aqa/restaurant-aqa-framework/TestResults/reqnroll/
          if-no-files-found: warn
          retention-days: 30

      # ScenarioStageHooks.HandleTrace writes each captured trace to TestResults/traces/ next to the
      # TUnit and Reqnroll reports (Core/ArtifactPaths.cs) - open one with
      # `npx playwright show-trace <file>.zip` for a full post-mortem replay (DOM snapshots, network,
      # console) of the failing @ui scenario. Only present when a @ui scenario actually failed (or
      # was tagged @trace-always), so "no files" is expected, not an error, on an @api-only or
      # all-green run.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: aqa/restaurant-aqa-framework/TestResults/traces/*.zip
          if-no-files-found: ignore
          retention-days: 30

      # Always runs, whatever the test step did: counts and failed scenarios come from the TRX the
      # run wrote, so the summary stays useful for a red run and says so plainly when the test
      # process died before producing any results.
      - name: Write job summary
        if: always()
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          FILTER: ${{ steps.filter.outputs.filter }}
          RUN_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          import xml.etree.ElementTree as ET

          print("## AQA test run\n")
          print(f"- Scope: `{os.environ['SCOPE']}`")
          print(f"- Filter: `{os.environ['FILTER'] or '(none - all scenarios)'}`")

          files = glob.glob("TestResults/*.trx")
          if not files:
              print("- Result: ⚠️ **no TRX results were produced**")
              print("- The test runner completed without a report; inspect the Run tests step output.")
              raise SystemExit(0)

          root = ET.parse(files[0]).getroot()
          ns = {"t": root.tag.split("}")[0].strip("{")}
          counters = root.find(".//t:ResultSummary/t:Counters", ns).attrib
          failed = [r.get("testName") for r in root.findall(".//t:UnitTestResult", ns) if r.get("outcome") == "Failed"]
          skipped = int(counters["notExecuted"])
          icon = "✅" if os.environ["RUN_OUTCOME"] == "success" else "❌"
          print(f"- Result: {icon} {'passed' if icon == '✅' else 'failed'}\n")
          print("| Total | Passed | Failed | Skipped |")
          print("|---:|---:|---:|---:|")
          print(f"| {counters['total']} | {counters['passed']} | {counters['failed']} | {skipped} |\n")
          if failed:
              print("### Failed scenarios\n")
              for name in failed:
                  print(f"- {name}")
              print()
          print("Reports, traces and the TRX are attached to this run as artifacts.")
          PY

      - name: Record test-run outcome
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "::warning::The AQA runner reported a failure. Reports and logs were uploaded above."
          else
            echo "AQA runner completed."
          fi
